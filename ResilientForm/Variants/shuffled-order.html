<!doctype html>
<html><head><meta charset="utf-8"><meta name="expected-copies" content="1"><title>Shuffled order</title></head>
<body>
<!-- Same fields, different order: State first, Last Name before First Name, Country beside State. -->
<form id="automationtestform">
  <div class="form-group"><label for="state">State</label>
    <select id="state" name="State" data-truth="state">
      <option>-- Select Country --</option><option value="India">India</option><option value="Kenya">Kenya</option>
    </select></div>
  <div class="form-group"><label for="country">Country</label>
    <input id="country" type="text" name="Country" placeholder="Country"></div>
  <div class="form-group"><label for="lname">Last Name</label>
    <input id="lname" type="text" name="Last Name" placeholder="Surname"></div>
  <div class="form-group"><label>Gender</label>
    <div>
      <input id="female" type="radio" name="gender" value="Female" data-truth="gender"><span>Female</span>
      <input id="transgender" type="radio" name="gender" value="Transgender" data-truth="gender"><span>Transgender</span>
      <input id="male" type="radio" name="gender" value="Male" data-truth="gender"><span>Male</span>
    </div></div>
  <div class="form-group"><label for="fname">First Name</label>
    <input id="fname" type="text" name="First Name" placeholder="Name" data-truth="first-name"></div>
</form>
</body></html>
